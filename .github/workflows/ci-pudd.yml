name: CI - API

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./API

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore Pudd.slnx

      - name: Compilar
        run: dotnet build Pudd.slnx --no-restore --configuration Release

      - name: Executar testes
        run: dotnet test Pudd.slnx --no-build --configuration Release
