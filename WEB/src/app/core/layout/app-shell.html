<a class="skip-link" href="#main-content">Pular para o conteúdo</a>
<div class="app-layout">
  <aside class="sidebar">
    <a class="wordmark" routerLink="/feed" aria-label="Pudd, página inicial">pudd<span>✳</span></a>
    <p class="nav-caption">SEU CANTO NA INTERNET</p>
    <nav aria-label="Navegação principal">
      <a pButton [text]="true" severity="secondary" routerLink="/feed" routerLinkActive="active"
        ><span aria-hidden="true">◈</span> Feed</a
      >
      <a
        pButton
        [text]="true"
        severity="secondary"
        routerLink="/profile/me"
        routerLinkActive="active"
        ><span aria-hidden="true">◎</span> Meu perfil</a
      >
      @if (session.isAdmin()) {
        <a pButton [text]="true" severity="secondary" routerLink="/admin" routerLinkActive="active"
          ><span aria-hidden="true">◇</span> Administração</a
        >
      }
    </nav>
    <a severity="secondary" pButton routerLink="/posts/new"
      ><span aria-hidden="true">＋</span> Criar publicação</a
    >
    <div class="sidebar-bottom">
      <div class="identity">
        <p-avatar shape="circle" [label]="session.user().email.slice(0, 1).toUpperCase()" />
        <div>
          <strong>Seu espaço, sua voz.</strong><small>{{ session.user().email }}</small>
        </div>
      </div>
      <button [text]="true" severity="secondary" pButton type="button" (click)="logout()">
        Sair da conta ↗
      </button>
    </div>
  </aside>
  <div class="main-column">
    <header class="topbar">
      <span>Pequenos momentos. Boas conexões.</span
      ><p-tag value="COMUNIDADE DEV" icon="pi pi-code" />
    </header>
    <main id="main-content" tabindex="-1"><router-outlet /></main>
    <footer>Feito de pessoas, ideias e um pouco de código. <span>© Pudd 2026</span></footer>
  </div>
</div>
