<ng-template #field>
  @if (type() === 'password') {
    <input
      pInputPassword
      class="password-input"
      [mask]="!showPassword()"
      [id]="inputId()"
      [formControl]="control()"
      [autocomplete]="autocomplete()"
      [required]="required()"
      [readOnly]="readOnly()"
      [placeholder]="placeholder()"
      [pSize]="stacked() ? 'large' : undefined"
      [invalid]="!!error()"
      [attr.aria-invalid]="!!error()"
      [attr.aria-describedby]="
        error() ? inputId() + '-error' + (describedBy() ? ' ' + describedBy() : '') : describedBy()
      "
    />
  } @else {
    <input
      pInputText
      [id]="inputId()"
      [type]="type()"
      [formControl]="control()"
      [autocomplete]="autocomplete()"
      [required]="required()"
      [readOnly]="readOnly()"
      [placeholder]="placeholder()"
      [pSize]="stacked() ? 'large' : undefined"
      [invalid]="!!error()"
      [attr.aria-invalid]="!!error()"
      [attr.aria-describedby]="
        error() ? inputId() + '-error' + (describedBy() ? ' ' + describedBy() : '') : describedBy()
      "
    />
  }
  @if (type() === 'password') {
    <button
      pButton
      type="button"
      severity="secondary"
      [text]="true"
      [rounded]="true"
      class="password-toggle"
      [disabled]="control().disabled"
      [attr.aria-pressed]="showPassword()"
      [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
      (click)="showPassword.set(!showPassword())"
    >
      <i [class]="showPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'" aria-hidden="true"></i>
    </button>
  }
</ng-template>
@if (stacked()) {
  <label class="field-label" [for]="inputId()">{{ label() }}</label>
  <div class="input-field">
    <p-iconfield>
      @if (icon()) {
        <p-inputicon><i [class]="icon()" aria-hidden="true"></i></p-inputicon>
      }
      <ng-container [ngTemplateOutlet]="field" />
    </p-iconfield>
  </div>
} @else {
  <p-floatlabel variant="on">
    <ng-container [ngTemplateOutlet]="field" />
    <label [for]="inputId()">{{ label() }}</label>
  </p-floatlabel>
}
@if (error()) {
  <small class="field-error" [id]="inputId() + '-error'" role="alert">{{ error() }}</small>
}
