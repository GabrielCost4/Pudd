<nav aria-label="Paginação" class="pagination">
  <button
    severity="secondary"
    pButton
    type="button"
    [disabled]="page() <= 1 || busy()"
    (click)="changed.emit(page() - 1)"
  >
    <i class="pi pi-chevron-left" aria-hidden="true"></i> Anterior
  </button>
  <span aria-live="polite">Página {{ page() }}</span>
  <button
    severity="secondary"
    pButton
    type="button"
    [disabled]="!hasNext() || busy()"
    (click)="changed.emit(page() + 1)"
  >
    Próxima <i class="pi pi-chevron-right" aria-hidden="true"></i>
  </button>
</nav>
