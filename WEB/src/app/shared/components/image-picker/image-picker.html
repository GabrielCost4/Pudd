<div class="picker">
  <p-fileupload
    #picker
    mode="basic"
    chooseLabel="Escolher uma imagem"
    accept="image/jpeg,image/png,image/webp"
    [customUpload]="true"
    [auto]="false"
    [disabled]="disabled()"
    (onSelect)="choose($event, picker)"
  />
  <small>JPG, PNG ou WebP · até 5 MB</small>
  @if (preview()) {
    <div class="preview">
      <img [src]="preview()" alt="Prévia da imagem selecionada" />
      <span>{{ filename() }}</span>
      <button pButton type="button" severity="secondary" [disabled]="disabled()" (click)="clear()">
        Descartar seleção
      </button>
    </div>
  }
  @if (error()) {
    <p-message severity="error" role="alert">{{ error() }}</p-message>
  }
</div>
