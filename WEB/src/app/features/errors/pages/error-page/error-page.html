<main class="error-layout">
  <header class="error-toolbar">
    <a
      class="brand-placeholder"
      [routerLink]="session.isAuthenticated() ? '/feed' : '/login'"
      aria-label="Pudd"
      ><app-brand-logo /><span>Pudd</span></a
    >
    <app-theme-toggle [dark]="theme.mode() === 'dark'" (toggled)="theme.toggle()" />
  </header>
  <p-card class="error-card">
    <div class="error-code" aria-hidden="true">{{ code }}</div>
    <p class="eyebrow">{{ notFound ? 'CAMINHO NÃO ENCONTRADO' : 'ACESSO NÃO AUTORIZADO' }}</p>
    <h1>{{ title }}</h1>
    <p class="muted">{{ description }}</p>
    <div class="actions">
      @if (session.isAuthenticated()) {
        <a pButton routerLink="/feed">Voltar para o feed</a>
      } @else {
        <a pButton routerLink="/login">Ir para o login</a>
      }
      @if (!session.isAuthenticated()) {
        <a severity="secondary" [text]="true" pButton routerLink="/register">Criar uma conta</a>
      }
    </div>
  </p-card>
</main>
