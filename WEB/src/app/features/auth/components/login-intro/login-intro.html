<canvas
  #ditherCanvas
  class="dither-canvas"
  [class.ready]="ditherReady()"
  aria-hidden="true"
></canvas>
<aside class="intro" aria-label="Apresentação do Pudd">
  <div class="intro-brand"><app-brand-logo class="image-brand" /></div>
  <div class="intro-story">
    <h2>Crie.<br />Compartilhe.<br /><span>Evolua.</span></h2>
    <p>
      Um lugar para compartilhar projetos, ideias e aprendizados com uma comunidade que também ama
      criar.
    </p>
  </div>
  <div class="intro-features">
    <div class="intro-feature">
      <i class="pi pi-users" aria-hidden="true"></i>
      <div>
        <strong>Conecte-se</strong>
        <p>Conheça pessoas da sua área.</p>
      </div>
    </div>
    <div class="intro-feature">
      <i class="pi pi-folder" aria-hidden="true"></i>
      <div>
        <strong>Compartilhe</strong>
        <p>Mostre seus projetos e aprendizagens.</p>
      </div>
    </div>
    <div class="intro-feature">
      <i class="pi pi-chart-line" aria-hidden="true"></i>
      <div>
        <strong>Evolua</strong>
        <p>Receba feedbacks e inspire-se.</p>
      </div>
    </div>
  </div>
</aside>
