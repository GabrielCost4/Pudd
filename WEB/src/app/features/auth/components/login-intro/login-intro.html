<aside class="intro" aria-label="Apresentação do Pudd">
  <canvas
    #ditherCanvas
    class="dither-effect"
    [class.ready]="ditherReady()"
    aria-hidden="true"
  ></canvas>
  <app-brand-logo class="image-brand" />
  <details class="getting-started">
    <summary>
      <i class="pi pi-info-circle" aria-hidden="true"></i>Como começar<i
        class="pi pi-chevron-down"
        aria-hidden="true"
      ></i>
    </summary>
    <div class="steps">
      <p-stepper [value]="1" aria-label="Como usar o Pudd">
        <p-step-item [value]="1">
          <p-step>Crie sua conta</p-step>
          <p-step-panel
            ><ng-template #content>
              <p class="step-description">
                Cadastre seu nome, e-mail e senha. Se já tem uma conta, entre ao lado.
              </p>
            </ng-template></p-step-panel
          >
        </p-step-item>
        <p-step-item [value]="2">
          <p-step>Complete seu perfil</p-step>
          <p-step-panel
            ><ng-template #content>
              <p class="step-description">
                Em Meu perfil, adicione sua foto e uma bio para se apresentar.
              </p>
            </ng-template></p-step-panel
          >
        </p-step-item>
        <p-step-item [value]="3">
          <p-step>Publique e comente</p-step>
          <p-step-panel
            ><ng-template #content>
              <p class="step-description">
                Crie publicações com texto e imagem. No feed, curta e comente os projetos de outras
                pessoas.
              </p>
            </ng-template></p-step-panel
          >
        </p-step-item>
      </p-stepper>
    </div>
  </details>
</aside>
